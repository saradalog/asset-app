name: 投資信託の基準価額を取得

on:
  schedule:
    - cron: '30 14 * * 1-5'   # 平日 23:30（日本時間）基準価額の公表後
    - cron: '0 21 * * 0-4'    # 平日 6:00（日本時間）Apps Scriptの7時の更新の前に念のため
  workflow_dispatch:
  push:
    paths: ['fund-codes.txt', 'scripts/fetch_fund_nav.py', '.github/workflows/fund-nav.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/fetch_fund_nav.py
      - name: 変わっていれば保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fund-nav.json
          git diff --cached --quiet || (git commit -m "基準価額を更新" && git push)
