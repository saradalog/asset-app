<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>資産管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#1e2228;--line:#2a2f37;--tx:#eceef1;--sub:#9aa1ab;--acc:#4f8cff;--pos:#3fcf8e;--neg:#ff6b6b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,19,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
header .upd{font-size:11px;color:var(--sub)}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 11px;font-size:13px}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px);max-width:720px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.lbl{font-size:12px;color:var(--sub)}
.big{font-size:30px;font-weight:700;letter-spacing:.3px;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.mid{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--sub);margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.num{font-variant-numeric:tabular-nums}
.alloc{display:flex;gap:14px;align-items:center}
.alloc .cv{width:120px;height:120px;flex:none}
.legend{flex:1;min-width:0}
.legend div{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;gap:6px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.seg{display:flex;gap:4px;background:var(--card2);padding:3px;border-radius:9px}
.seg button{background:none;border:0;color:var(--sub);padding:4px 9px;border-radius:7px;font-size:12px}
.seg button.on{background:var(--line);color:var(--tx)}
.hcv{height:200px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid var(--line);gap:10px}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12px;color:var(--sub);margin-top:2px}
.row .r{text-align:right;flex:none}
.badge{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:4px;color:var(--sub);vertical-align:1px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:600;width:100%}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid #5a2a2a}
.btn.sm{width:auto;padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#3fcf8e)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(18,20,24,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:18px;width:min(560px,94vw);max-height:88vh;padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.dlg-h b{font-size:16px}
.dlg-b{padding:14px 16px 18px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 11px;font-size:16px;font-family:inherit}
.f .hint{font-size:11px;color:var(--sub);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:#2b3240;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:13px}
.demo{background:#2a2410;border:1px solid #5c4c14;color:#f1d27a;font-size:12px;border-radius:10px;padding:8px 10px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.kv span:first-child{color:var(--sub)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--sub);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div><h1 id="title">ホーム</h1><div class="upd" id="upd"></div></div>

</header>

<main>

  <section id="v-home" class="on"></section>

<nav id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-v="hold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>保有</button>
  <button data-v="div"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 8l3 4 3-4M12 12v5M9 13h6M9 15.5h6"/></svg>配当</button>
  <button data-v="fire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>FIRE</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>

<dialog id="dlg"><div class="dlg-h"><b id="dlgTitle"></b><button class="iconbtn" id="dlgClose">閉じる</button></div><div class="dlg-b" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ===== 定数 ===== */
const CAT = {
  jp:{label:'日本株',color:'#e5484d'}, us:{label:'米国株',color:'#4f8cff'}, hk:{label:'中国株',color:'#f76b15'},
  fund:{label:'投資信託',color:'#30a46c'}, crypto:{label:'暗号資産',color:'#a26ee0'}, gold:{label:'金',color:'#d6a700'},
  cash:{label:'現金・預金',color:'#8b8d98'}, other:{label:'その他',color:'#12a594'}
};
const ACCOUNTS = ['特定','一般','NISA成長','NISAつみたて','iDeCo','その他'];
const DEF_CUR = {jp:'JPY',us:'USD',hk:'HKD',fund:'JPY',crypto:'JPY',gold:'JPY',cash:'JPY',other:'JPY'};
const CUR_SYM = {JPY:'¥',USD:'$',HKD:'HK$'};
const TITLES = {home:'ホーム',hold:'保有資産',div:'配当',fire:'FIRE',set:'設定'};
const LS_CFG='am_cfg', LS_CACHE='am_cache', LS_DEMO='am_demo';

/* ===== ユーティリティ ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const yen = v => '¥' + Math.round(v).toLocaleString('ja-JP');
const syen = v => (v >= 0 ? '+' : '−') + '¥' + Math.round(Math.abs(v)).toLocaleString('ja-JP');
const man = v => Math.abs(v) >= 1e8 ? (v/1e8).toFixed(2) + '億円' : (v/1e4).toLocaleString('ja-JP',{maximumFractionDigits:0}) + '万円';
const pct = (v,d=1) => (v >= 0 ? '+' : '') + (v*100).toFixed(d) + '%';
const cls = v => v >= 0 ? 'pos' : 'neg';
const fmtN = (v,d=2) => num(v).toLocaleString('ja-JP',{maximumFractionDigits:d});
const todayStr = () => { const d = new Date(Date.now() + 9*3600e3); return d.toISOString().slice(0,10); };
const lsGet = (k,def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch(e) { return def; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }

/* ===== 状態 ===== */
let cfg = lsGet(LS_CFG, {apiUrl:'', token:''});
let D = {holdings:[], dividends:[], history:[], settings:{}, fx:{JPY:1,USD:150,HKD:19}, updated:''};
let view = 'home', homeRange = '1Y';
const charts = {};
const isDemo = () => !cfg.apiUrl;

/* ===== 計算 ===== */
function netRatio(h){
  const free = /^(NISA|iDeCo)/.test(h.account || '');
  const foreign = h.type === 'us' || h.type === 'hk';
  return (foreign ? 0.9 : 1) * (free ? 1 : (1 - 0.20315));
}
function calc(h, fx = D.fx){
  const cur = h.currency || DEF_CUR[h.type] || 'JPY';
  const rate = cur === 'JPY' ? 1 : (num(fx[cur]) || 0);
  const div = h.type === 'fund' ? 10000 : 1;
  const q = num(h.qty);
  const price = h.type === 'cash' ? 1 : num(h.price);
  const value = q * price / div * rate;
  const cp = h.type === 'cash' ? 1 : num(h.cost);
  const cfx = cur === 'JPY' ? 1 : (num(h.costFx) || rate);
  const cost = cp > 0 ? q * cp / div * cfx : value;
  const prev = num(h.prevClose);
  const day = (prev > 0 && h.type !== 'cash') ? q * (price - prev) / div * rate : 0;
  const divAnnual = q * num(h.dps) / div * rate;
  return {cur, rate, price, value, cost, pl: value - cost, plr: cost > 0 ? (value - cost) / cost : 0, day, divAnnual, divNet: divAnnual * netRatio(h)};
}
function summary(){
  const s = {total:0, cost:0, day:0, div:0, divNet:0, cat:{}, items:[]};
  Object.keys(CAT).forEach(k => s.cat[k] = {value:0, cost:0, items:[]});
  D.holdings.forEach(h => {
    const c = calc(h); const k = CAT[h.type] ? h.type : 'other';
    const it = {h, ...c};
    s.items.push(it); s.cat[k].items.push(it); s.cat[k].value += c.value; s.cat[k].cost += c.cost;
    s.total += c.value; s.cost += c.cost; s.day += c.day; s.div += c.divAnnual; s.divNet += c.divNet;
  });
  s.pl = s.total - s.cost; s.plr = s.cost > 0 ? s.pl / s.cost : 0;
  return s;
}
function fireCalc(total, divNet){
  const st = D.settings || {};
  const expense = num(st.expense), wr = num(st.withdrawRate) || 4;
  const target = num(st.target) || (expense > 0 ? expense / (wr/100) : 0);
  const monthly = num(st.monthly), ret = num(st.returnRate) / 100, age = num(st.age);
  const r = Math.pow(1 + ret, 1/12) - 1;
  let a = total, reachM = total >= target && target > 0 ? 0 : -1;
  const yearly = [total];
  for (let m = 1; m <= 600; m++) {
    a = a * (1 + r) + monthly;
    if (reachM < 0 && target > 0 && a >= target) reachM = m;
    if (m % 12 === 0) yearly.push(a);
  }
  return {expense, wr, target, monthly, ret, age, reachM, yearly, progress: target > 0 ? total / target : 0, divCover: expense > 0 ? divNet / expense : 0};
}

/* ===== API ===== */
async function api(action, data){
  if (isDemo()) return demoCall(action, data);
  const res = await fetch(cfg.apiUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, token: cfg.token, data})});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j;
}
async function run(action, data, okMsg){
  try {
    const j = await api(action, data);
    setData(j);
    if (okMsg) toast(okMsg);
    return true;
  } catch(e) { toast('失敗：' + e.message); return false; }
}
function setData(j){
  D = {holdings:j.holdings||[], dividends:j.dividends||[], history:j.history||[], settings:j.settings||{}, fx:Object.assign({JPY:1}, j.fx||{}), goldPerGram:j.goldPerGram||0, updated:j.updated||''};
  if (!isDemo()) lsSet(LS_CACHE, D);
  renderAll();
}

/* ===== デモ ===== */
function demoSeed(){
  const fx = {JPY:1, USD:152.4, HKD:19.6};
  const H = [
    {id:'d1',type:'jp',code:'7203',name:'トヨタ自動車',account:'NISA成長',qty:200,cost:2480,dps:95,price:2915,prevClose:2890},
    {id:'d2',type:'jp',code:'8058',name:'三菱商事',account:'特定',qty:300,cost:2620,dps:110,price:3310,prevClose:3335},
    {id:'d3',type:'jp',code:'9432',name:'NTT',account:'NISA成長',qty:3000,cost:150,dps:5.3,price:154.5,prevClose:153.9},
    {id:'d4',type:'us',code:'VOO',name:'Vanguard S&P 500 ETF',account:'特定',qty:12,cost:455,currency:'USD',costFx:148,dps:6.9,price:562,prevClose:558},
    {id:'d5',type:'hk',code:'0700',name:'騰訊控股',account:'特定',qty:100,cost:385,currency:'HKD',costFx:18.9,dps:4.5,price:521,prevClose:526},
    {id:'d6',type:'fund',code:'',name:'eMAXIS Slim 全世界株式',account:'NISAつみたて',qty:1600000,cost:21000,manualPrice:31850,price:31850},
    {id:'d7',type:'crypto',code:'BTC',name:'ビットコイン',account:'その他',qty:0.05,cost:9200000,price:15200000,prevClose:15050000},
    {id:'d8',type:'gold',code:'',name:'純金積立',account:'その他',qty:80,cost:12800,price:19800},
    {id:'d9',type:'cash',code:'',name:'普通預金',account:'その他',qty:2800000},
  ].map(h => Object.assign({currency:DEF_CUR[h.type], costFx:'', dps:'', manualPrice:'', prevClose:'', priceUpdated:'', memo:''}, h));
  const total = H.reduce((a,h) => a + calc(h, fx).value, 0);
  const cost = H.reduce((a,h) => a + calc(h, fx).cost, 0);
  const hist = []; let v = total; let c = cost;
  for (let i = 0; i < 400; i++) {
    const d = new Date(Date.now() + 9*3600e3 - i*86400e3);
    hist.unshift({date: d.toISOString().slice(0,10), total: Math.round(v), cost: Math.round(c)});
    v = v / (1 + (Math.random() - 0.47) * 0.016) - (i % 30 === 0 ? 100000 : 0);
    if (i % 30 === 0) c -= 100000;
  }
  const y = new Date().getFullYear();
  const dv = [
    [`${y}-03-10`,'8058','三菱商事',13200,'特定'],[`${y}-06-02`,'7203','トヨタ自動車',9000,'NISA成長'],[`${y}-06-27`,'8058','三菱商事',13200,'特定'],
    [`${y}-07-01`,'9432','NTT',7800,'NISA成長'],[`${y}-09-30`,'VOO','Vanguard S&P 500 ETF',2400,'特定'],[`${y}-11-28`,'7203','トヨタ自動車',9500,'NISA成長'],
    [`${y-1}-06-05`,'7203','トヨタ自動車',8000,'NISA成長'],[`${y-1}-06-28`,'8058','三菱商事',10500,'特定'],[`${y-1}-12-01`,'7203','トヨタ自動車',9000,'NISA成長'],
  ].map((r,i) => ({id:'v'+i, date:r[0], code:r[1], name:r[2], amount:r[3], account:r[4], memo:''}));
  return {holdings:H, dividends:dv, history:hist, settings:{expense:3000000, withdrawRate:4, target:'', monthly:100000, returnRate:5, age:35}, fx, updated:'デモ'};
}
function demoSnapshot(s){
  const row = {date: todayStr(), total:0, cost:0};
  s.holdings.forEach(h => { const c = calc(h, s.fx); row.total += c.value; row.cost += c.cost; });
  row.total = Math.round(row.total); row.cost = Math.round(row.cost);
  const i = s.history.findIndex(r => r.date === row.date);
  if (i >= 0) s.history[i] = row; else s.history.push(row);
}
function demoCall(action, d){
  const s = lsGet(LS_DEMO, null) || demoSeed();
  const id = () => Math.random().toString(36).slice(2,10);
  switch (action) {
    case 'saveHolding': {
      const i = s.holdings.findIndex(h => h.id === d.id);
      const old = i >= 0 ? s.holdings[i] : {};
      const h = Object.assign({}, old, d, {id: d.id || id()});
      if (num(h.manualPrice) > 0) h.price = num(h.manualPrice);
      if (!num(h.price)) h.price = num(h.cost) || 1;
      if (i >= 0) s.holdings[i] = h; else s.holdings.push(h);
      demoSnapshot(s); break;
    }
    case 'deleteHolding': s.holdings = s.holdings.filter(h => h.id !== d.id); demoSnapshot(s); break;
    case 'saveDividend': {
      const i = s.dividends.findIndex(x => x.id === d.id);
      const o = Object.assign({}, d, {id: d.id || id(), amount: num(d.amount)});
      if (i >= 0) s.dividends[i] = o; else s.dividends.push(o);
      break;
    }
    case 'deleteDividend': s.dividends = s.dividends.filter(x => x.id !== d.id); break;
    case 'saveSettings': Object.assign(s.settings, d); break;
    case 'refresh':
      s.holdings.forEach(h => { if (h.type === 'cash' || num(h.manualPrice) > 0) return; h.prevClose = h.price; h.price = Math.round(num(h.price) * (1 + (Math.random() - 0.48) * 0.03) * 100) / 100; });
      s.updated = 'デモ ' + new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
      demoSnapshot(s); break;
  }
  lsSet(LS_DEMO, s);
  return Promise.resolve(JSON.parse(JSON.stringify(Object.assign({ok:true}, s))));
}

/* ===== チャート ===== */
Chart.defaults.color = '#9aa1ab';
Chart.defaults.borderColor = '#2a2f37';
Chart.defaults.font.family = '-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif';
function mkChart(id, config){
  if (charts[id]) charts[id].destroy();
  const el = document.getElementById(id);
  if (!el) return;
  charts[id] = new Chart(el, config);
}
const yAxisMan = {ticks:{callback: v => man(v)}, grid:{color:'#22262d'}};

/* ===== 描画 ===== */
function renderAll(){
  $('#demoBar').hidden = !isDemo();
  $('#upd').textContent = D.updated ? '価格更新 ' + D.updated : '';
  renderHome(); renderHold(); renderDiv(); renderFire(); renderSet();
}

function renderHome(){

function holdRow(it, total){
  const h = it.h;
  const sym = CUR_SYM[it.cur] || '';
  let meta;
  if (h.type === 'cash') meta = `${esc(h.account || '')}${it.cur !== 'JPY' ? '・' + it.cur : ''}`;
  else {
    const unit = h.type === 'fund' ? '口' : h.type === 'gold' ? 'g' : h.type === 'crypto' ? '' : '株';
    meta = `${esc(h.code)} ${fmtN(h.qty, 8)}${unit}・${sym}${fmtN(it.price)}${num(h.manualPrice) > 0 ? '<span class="badge">手動</span>' : ''}${!it.price ? '<span class="badge" style="color:var(--neg)">価格なし</span>' : ''}`;
  }
  return `<div class="row" data-hid="${esc(h.id)}">
    <div class="l"><div class="nm">${esc(h.name || h.code)}${h.account ? `<span class="badge">${esc(h.account)}</span>` : ''}</div><div class="meta">${meta}</div></div>
    <div class="r"><div class="num">${yen(it.value)}</div><div class="meta"><span class="${cls(it.pl)}">${h.type === 'cash' ? '' : pct(it.plr)}</span> ${total ? (it.value/total*100).toFixed(1) + '%' : ''}</div></div>
  </div>`;
}

const TYPE_HINT = {
  jp:{code:'証券コード（例 7203）', qty:'株数', cost:'取得単価（円）', price:'空欄なら自動取得'},
  us:{code:'ティッカー（例 AAPL、VOO）', qty:'株数', cost:'取得単価（ドル）', price:'空欄なら自動取得'},
  hk:{code:'銘柄コード（例 0700）', qty:'株数', cost:'取得単価（香港ドル）', price:'空欄なら自動取得'},
  fund:{code:'任意（協会コードなど）', qty:'保有口数（口）', cost:'平均取得単価（1万口あたり・円）', price:'基準価額（1万口あたり）を入力。投信は自動取得なし'},
  crypto:{code:'通貨記号（例 BTC、ETH）', qty:'数量', cost:'取得単価（円）', price:'空欄なら自動取得'},
  gold:{code:'任意', qty:'グラム数', cost:'取得単価（円/g）', price:'空欄なら国際金価格から自動計算（円/g・税抜）'},
  cash:{code:'任意', qty:'金額', cost:'不要', price:'不要'},
  other:{code:'任意', qty:'数量', cost:'取得単価', price:'現在の単価を入力'},
};
function openHolding(id){
  const h = D.holdings.find(x => String(x.id) === String(id)) || {type:'jp', account:'特定', currency:'JPY'};
  const opt = (arr, v) => arr.map(a => `<option value="${esc(a[0])}" ${String(a[0]) === String(v) ? 'selected' : ''}>${esc(a[1])}</option>`).join('');

    <form id="fH">
      <input type="hidden" name="id" value="${esc(h.id || '')}">
      <div class="f2">
        <div class="f"><label>種別</label><select name="type">${opt(Object.keys(CAT).map(k=>[k,CAT[k].label]), h.type)}</select></div>
        <div class="f"><label>口座</label><select name="account">${opt(ACCOUNTS.map(a=>[a,a]), h.account)}</select></div>
      </div>
      <div class="f"><label id="lCode">コード</label><input name="code" value="${esc(h.code || '')}" autocapitalize="characters" autocomplete="off"></div>
      <div class="f"><label>名称</label><input name="name" value="${esc(h.name || '')}" autocomplete="off"></div>
      <div class="f2">
        <div class="f"><label id="lQty">数量</label><input name="qty" inputmode="decimal" value="${esc(h.qty ?? '')}"></div>
        <div class="f" id="wCost"><label id="lCost">取得単価</label><input name="cost" inputmode="decimal" value="${esc(h.cost ?? '')}"></div>
      </div>
      <div class="f2">
        <div class="f"><label>通貨</label><select name="currency">${opt([['JPY','円'],['USD','米ドル'],['HKD','香港ドル']], h.currency || DEF_CUR[h.type])}</select></div>
        <div class="f" id="wFx"><label>取得時の為替（円）</label><input name="costFx" inputmode="decimal" value="${esc(h.costFx ?? '')}" placeholder="空欄＝現在レート"></div>
      </div>
      <div class="f" id="wDps"><label id="lDps">1株あたり年間配当（現地通貨）</label><input name="dps" inputmode="decimal" value="${esc(h.dps ?? '')}"></div>
      <div class="f" id="wPrice"><label>手動価格</label><input name="manualPrice" inputmode="decimal" value="${esc(h.manualPrice ?? '')}"><div class="hint" id="hPrice"></div></div>
      <div class="f"><label>メモ</label><textarea name="memo" rows="2">${esc(h.memo || '')}</textarea></div>
      ${id && h.priceUpdated ? `<div class="sub" style="margin-bottom:12px">現在値 ${fmtN(h.price)}（${esc(h.priceUpdated)} 更新）</div>` : ''}
      <button class="btn" type="submit">保存</button>
      ${id ? '<div style="height:10px"></div><button class="btn danger" type="button" id="btnDelH">この資産を削除</button>' : ''}

    const t = f.type.value, hint = TYPE_HINT[t];

    $('#hPrice').textContent = hint.price;

    $('#wPrice').style.display = t === 'cash' ? 'none' : '';
    $('#wDps').style.display = ['crypto','gold','cash'].includes(t) ? 'none' : '';

    $('#wFx').style.visibility = f.currency.value === 'JPY' ? 'hidden' : 'visible';
  };
  sync(false);
  f.type.onchange = () => sync(true);
  f.currency.onchange = () => sync(false);
  f.onsubmit = async e => {
    e.preventDefault();
    const o = Object.fromEntries(new FormData(f).entries());
    if (!o.qty) return toast('数量を入力してください');
    if (!o.name && !o.code) return toast('名称かコードを入力してください');

    closeDlg();
  };

}

      <form id="fC">
        <div class="f"><label>ウェブアプリのURL</label><input name="apiUrl" value="${esc(cfg.apiUrl)}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>
        <div class="f"><label>トークン</label><input name="token" value="${esc(cfg.token)}" autocomplete="off"><div class="hint">スプレッドシートのメニュー「資産管理 → トークンを表示」で確認できます</div></div>
        <button class="btn" type="submit">保存して接続</button>
      </form>
      <div class="sub" style="margin-top:10px">状態：${isDemo() ? 'デモモード（未接続）' : '接続済み'}</div>
    </div>
    <div class="card"><h3>データ</h3>
      <div class="kv"><span>価格の最終更新</span><span>${esc(D.updated || '—')}</span></div>
      <div class="kv"><span>為替</span><span>USD ${fmtN(D.fx.USD)}円 / HKD ${fmtN(D.fx.HKD, 3)}円</span></div>
      <div class="kv"><span>資産推移の記録</span><span>${D.history.length}日分</span></div>
      <div style="height:8px"></div>
      ${isDemo() ? '<button class="btn ghost" id="btnResetDemo">デモデータを初期化</button>' : '<button class="btn ghost" id="btnReload">シートから再読み込み</button>'}
    </div>
    <div class="card"><h3>メモ</h3><div class="sub" style="line-height:1.7">
      ・価格は毎日7時と16時に自動更新され、そのとき総資産を「資産推移」に記録します。<br>
      ・投資信託の基準価額は自動取得できないため「手動価格」に入れてください。<br>
      ・予想配当の税引後は、特定/一般口座20.315%、NISA非課税、米国株・中国株は現地課税10%で概算しています。
    </div></div>`;
  $('#fC').onsubmit = async e => {
    e.preventDefault();
    const o = Object.fromEntries(new FormData(e.target).entries());
    cfg = {apiUrl: o.apiUrl.trim(), token: o.token.trim()}; lsSet(LS_CFG, cfg);
    if (!cfg.apiUrl) { await run('all', {}); return toast('デモモードに戻しました'); }
    await busy(e.target.querySelector('[type=submit]'), () => run('all', {}, '接続しました'));
  };
  const rd = $('#btnResetDemo'); if (rd) rd.onclick = () => { localStorage.removeItem(LS_DEMO); run('all', {}, '初期化しました'); };
  const rl = $('#btnReload'); if (rl) rl.onclick = () => busy(rl, () => run('all', {}, '読み込みました'));
}

/* ===== ダイアログ・共通 ===== */
function openDlg(title, html){ $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = html; $('#dlg').showModal(); }
function closeDlg(){ const d = $('#dlg'); if (d.open) d.close(); }
$('#dlgClose').onclick = closeDlg;
async function busy(btn, fn){
  const t = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 処理中…';
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = t; }
}
function show(v){
  view = v;
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'v-' + v));
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#title').textContent = TITLES[v];
  window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => show(b.dataset.v));
$('#btnRefresh').onclick = () => busy($('#btnRefresh'), () => run('refresh', {}, '株価を更新しました'));

/* ===== 起動 ===== */
(async function init(){
  if (!isDemo()) { const c = lsGet(LS_CACHE, null); if (c) { D = c; renderAll(); } }
  else renderAll();
  await run('all', {});
})();
</script>
</body>
</html>
